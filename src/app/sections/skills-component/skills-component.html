<section class="skills section__container">
  <div class="skills__container">
    <h2 class="section-title skills__title">{{ 'header-menu.skills' | translate }}</h2>

    <div class="skills__grid">
      @for (skill of skills; track skill.name) {
        <div class="skill">
          <img class="skill__icon" [src]="skill.icon" alt="" />

          <span class="skill__name">
            {{ skill.name }}
          </span>
        </div>
      }
    </div>

    <div class="skills__learning">
      <img class="skills__learning-icon" src="assets/icons/learn-icon.png" alt="" />

      <p>
        <span>{{ 'skills.skill' | translate }}</span>

        <a href="#contact">{{ 'skills.contact' | translate }}</a>

        <span>{{ 'skills.ready' | translate }}</span>
      </p>
    </div>
  </div>
</section>
