<section id="skills" class="skills">
  <h2 class="section-title skills__title">My skills</h2>

  <div class="skills__grid">
    @for (skill of skills; track skill.name) {
      <div class="skill">
        <img class="skill__icon" [src]="skill.icon" alt="" />

        <span class="skill__name">
          {{ skill.name }}
        </span>
      </div>
    }
  </div>

  <div class="skills__learning">
    <img class="skills__learning-icon" src="assets/icons/learn-icon.png" alt="" />

    <p>
      <span>Don’t see the skill you need?</span>

      <a href="#contact"> Contact me </a>

      <span>I’m always ready to learn!</span>
    </p>
  </div>
</section>
