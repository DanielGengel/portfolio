<section id="about" class="about section__container">
  <h2 class="section-title about__title">{{ 'header-menu.about' | translate }}</h2>

  <div class="about__container">
    <div class="about__content">
      <div class="about__text">
        <p>
          {{ 'about.text' | translate }}
        </p>

        <p>
          {{ 'about.text2' | translate }}
        </p>
      </div>

      <ul class="about__facts">
        <li>
          <img src="assets/icons/house-icon.png" alt="" aria-hidden="true" />

          <span>{{ 'about.base' | translate }}</span>
        </li>

        <li>
          <img src="assets/icons/laptop-icon.png" alt="" aria-hidden="true" />

          <span>{{ 'about.remote' | translate }}</span>
        </li>
      </ul>

      <a class="about__button" href="#contact"> {{ 'about.button' | translate }} </a>
    </div>

    <div class="about__image">
      <img src="assets/images/photo.jpg" alt="Portrait of Daniel" />
    </div>
  </div>
</section>
