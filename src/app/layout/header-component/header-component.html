<header class="header">
  <div class="header__content">
    <a class="logo" routerLink="/" aria-label="DG – Home" (click)="closeMenu()">
      <span class="logo__symbol" aria-hidden="true">
        <span class="logo__bracket logo__bracket--left"></span>
        <span class="logo__letter logo__letter--d">D</span>
        <span class="logo__letter logo__letter--b">/</span>
        <span class="logo__letter logo__letter--g">G</span>
        <span class="logo__bracket logo__bracket--right"></span>
      </span>
    </a>

    <div class="header-right">
      <div class="languages" [class.languages--menu-open]="menuOpen()">
        <button type="button" [class.active]="language() === 'en'" (click)="changeLanguage('en')">
          EN
        </button>

        <button type="button" [class.active]="language() === 'de'" (click)="changeLanguage('de')">
          DE
        </button>
      </div>

      <button
        #menuButton
        class="burger"
        type="button"
        aria-label="Menü öffnen oder schließen"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-menu"
        (click)="toggleMenu()"
      >
        <span [class.open]="menuOpen()"></span>
        <span [class.open]="menuOpen()"></span>
        <span [class.open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</header>

<nav
  id="main-menu"
  class="menu"
  [class.menu-open]="menuOpen()"
  [inert]="!menuOpen()"
  aria-label="Hauptnavigation"
>
  <div class="menu__links">
    <a class="menu__link" routerLink="/" fragment="about" (click)="closeMenu()"> {{ 'header-menu.about' | translate }} </a>

    <a class="menu__link" routerLink="/" fragment="skills" (click)="closeMenu()"> {{ 'header-menu.skills' | translate }} </a>

    <a class="menu__link" routerLink="/" fragment="portfolio" (click)="closeMenu()"> Portfolio </a>
  </div>

  <div class="menu__bottom">
    <div class="menu__contact">
      <strong>{{ 'header-menu.hi' | translate }}</strong>

      <a href="mailto:stefan@gmail.com"> stefan&#64;gmail.com </a>
    </div>

    <div class="menu__socials">
      <a
        href="https://github.com/dein-name"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <img src="assets/icons/github-link-icon.png" alt="" />
      </a>

      <a href="mailto:stefan@gmail.com" aria-label="E-Mail schreiben">
        <img src="assets/icons/email-link-icon.png" alt="" />
      </a>

      <a
        href="https://linkedin.com/in/dein-name"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
      >
        <img src="assets/icons/linkedin-link-icon.png" alt="" />
      </a>
    </div>
  </div>
</nav>
